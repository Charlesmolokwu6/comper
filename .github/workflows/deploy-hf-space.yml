# Deploys the app to a free Hugging Face Space (Docker) on every push.
#
# One-time setup (see docs/deploy.md):
#   1. Hugging Face → Settings → Access Tokens → create a token with "Write" access.
#   2. GitHub repo → Settings → Secrets and variables → Actions → New repository secret:
#      HF_TOKEN = that token.
#   3. Optional: repository variable HF_SPACE = "<hf-username>/<space-name>"
#      (defaults to Chiagozie/compare). The Space is created on the first run.
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main, claude/guo-live-prices-playwright-6xojq5]
  workflow_dispatch:

concurrency:
  group: hf-space-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE || 'Chiagozie/compare' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the token is set
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Add a repository secret HF_TOKEN (a Hugging Face token with write access). See docs/deploy.md."
            exit 1
          fi

      - name: Create the Space if it doesn't exist
        run: |
          name="${HF_SPACE#*/}"
          owner="${HF_SPACE%%/*}"
          code=$(curl -s -o /tmp/create.json -w '%{http_code}' -X POST https://huggingface.co/api/repos/create \
            -H "Authorization: Bearer $HF_TOKEN" -H "Content-Type: application/json" \
            -d "{\"type\":\"space\",\"name\":\"$name\",\"organization\":\"$owner\",\"sdk\":\"docker\",\"private\":false}")
          # 409 = already exists. Retry without "organization" when the owner is a user account.
          if [ "$code" = "400" ] || [ "$code" = "403" ]; then
            code=$(curl -s -o /tmp/create.json -w '%{http_code}' -X POST https://huggingface.co/api/repos/create \
              -H "Authorization: Bearer $HF_TOKEN" -H "Content-Type: application/json" \
              -d "{\"type\":\"space\",\"name\":\"$name\",\"sdk\":\"docker\",\"private\":false}")
          fi
          echo "create Space: HTTP $code"; cat /tmp/create.json; echo
          case "$code" in 200|201|409) ;; *) exit 1 ;; esac

      - name: Push the code to the Space
        run: |
          # A Space reads its settings from YAML at the top of README.md.
          { printf -- '---\ntitle: Compare\nemoji: 🚌\ncolorFrom: green\ncolorTo: gray\nsdk: docker\napp_port: 7860\npinned: false\n---\n\n'; cat README.md; } > README.space.md
          mv README.space.md README.md
          rm -rf .git .github
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
          echo "Deployed: https://huggingface.co/spaces/${HF_SPACE}"
          echo "App URL:  https://$(echo "${HF_SPACE}" | tr '/' '-' | tr '[:upper:]_.' '[:lower:]--').hf.space"
