# One-click setup on Render's free plan: Dashboard → New → Blueprint → pick this repo.
# Free web services sleep after 15 minutes without visitors and wake on the next visit (~1 min).
services:
  - type: web
    name: compare
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/fares/status
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard (Environment); they're never stored in the repo.
      - key: GOOGLE_MAPS_API_KEY # Geocoding API only; turns on Shipbubble's couriers
        sync: false
      - key: VITE_UMAMI_WEBSITE_ID # Umami Cloud website id; turns on visit counts
        sync: false
      - key: VITE_CONTACT_EMAIL # shown on the Privacy and Terms pages
        sync: false
      - key: VITE_FEEDBACK_WHATSAPP # WhatsApp number for feedback, e.g. 2348012345678
        sync: false
